apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: practica-s12
  labels:
    app.kubernetes.io/name: db-secret
    app.kubernetes.io/part-of: practica-s12
    tier: database
type: Opaque
# =============================================================================
# HARDENING: GESTIÓN SEGURA DE CREDENCIALES
# En Kubernetes, 'data' requiere valores codificados en Base64.
# (Para producción en AWS, se recomienda integrar con AWS Secrets Manager / KMS).
# =============================================================================
data:
  # admin -> YWRtaW4=
  DB_USER: YWRtaW4=
  # S12_SuperSecurePass_2026! -> UzEyX1N1cGVyU2VjdXJlUGFzc18yMDI2IQ==
  # NOTA DE TROUBLESHOOTING (Escenario A):
  # Durante la falla, el Deployment buscaba la clave inexistente 'DB_PASSWD',
  # provocando CrashLoopBackOff. La clave canónica corregida es 'DB_PASSWORD'.
  DB_PASSWORD: UzEyX1N1cGVyU2VjdXJlUGFzc18yMDI2IQ==
  # inventario_db -> aW52ZW50YXJpb19kYg==
  DB_NAME: aW52ZW50YXJpb19kYg==

  # Variables nativas de inicialización para el contenedor de base de datos
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  MONGO_INITDB_ROOT_PASSWORD: UzEyX1N1cGVyU2VjdXJlUGFzc18yMDI2IQ==
